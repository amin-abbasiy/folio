[package]
name = "folio-notes"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
description = "A quiet, private, local-only notebook for Linux"
license = "MIT"
default-run = "folio"

[[bin]]
name = "folio"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
directories = "6.0"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
fs2 = "0.4.3"
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
